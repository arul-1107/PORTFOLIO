version: '3.8'

services:

  frontend:
    build: ./metallic-frontend
    ports:
      - "91:80"
    depends_on:
      - backend

  backend:
    build: ./metallic-backend
    ports:
      - "8091:8091"
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metallicdb
    ports:
      - "3307:3306"
